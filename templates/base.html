<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Style Genie{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="site-header">
    <a class="brand" href="/">style<span>genie</span></a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light / dark mode" title="Toggle theme">◐</button>
  </header>

  <!-- ── Page content ───────────────────────────────────────────────────── -->
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Scripts ────────────────────────────────────────────────────────── -->
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
